<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Last Train Records — The city plays after midnight.</title>
    <meta
      name="description"
      content="A vinyl record whose grooves rise into a miniature late-night Tokyo railway neighbourhood, rendered live in the browser."
    />

    <!--
      Link previews. Social scrapers do not resolve relative paths, so the
      image and URL have to be absolute — this is the one place the deployed
      address is written down. Update both if the site ever moves.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Last Train Records" />
    <meta property="og:title" content="Last Train Records" />
    <meta
      property="og:description"
      content="A vinyl record whose grooves rise into a miniature late-night Tokyo railway neighbourhood, rendered live in the browser."
    />
    <meta property="og:url" content="https://hxmzaehsan.github.io/last-train-records/" />
    <meta property="og:image" content="https://hxmzaehsan.github.io/last-train-records/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A vinyl record on a dark surface, its outer edge risen into a miniature night-time Tokyo neighbourhood with a lit commuter train and neon signage."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Last Train Records" />
    <meta
      name="twitter:description"
      content="A vinyl record whose grooves rise into a miniature late-night Tokyo railway neighbourhood, rendered live in the browser."
    />
    <meta name="twitter:image" content="https://hxmzaehsan.github.io/last-train-records/og.jpg" />
    <style>
      html {
        background: #070403;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
